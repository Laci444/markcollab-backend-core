[package]
name = "markcollab-backend-core"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "0.3.31"
http = "1.2.0"
rdkafka = "0.39.0"
schemars = "1.2.1"
serde = { version = "1.0.215", features = ["derive", "rc"] }
serde_json = "1.0.133"
smallvec = "1.13.2"
thiserror = "2.0.11"
tokio = { version = "1.42.0", features = ["full"] }
uuid = { version = "1.15.1", features = ["v4", "serde"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
y-octo = "0.0.1" # TODO: upgrade to 0.0.2!!!! need some migrations dont have time now
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-futures = "0.2"
jsonwebtoken = "10.3"
async-trait = "0.1.89"
form_urlencoded = "1.2"
rand = "0.10.0"
base64 = "0.22.1"
nom = "7.1.3"
bytes = "1.11.1"
anyhow = "1.0.102"
dashmap = "6.1.0"
reqwest = { version = "0.13.2", features = ["json"] }
