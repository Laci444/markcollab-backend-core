[package]
name = "markcollab-backend-core"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3.31"
futures-core = "0.3.31"
futures-util = "0.3.31"
http = "1.2.0"
jsonschema = "0.27.1"
nom = "7.1.3"
rdkafka = "0.37.0"
schemars = "0.8.21"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
smallvec = "1.13.2"
thiserror = "2.0.11"
tokio = { version = "1.42.0", features = ["full"] }
tokio-stream = "0.1.17"
tokio-tungstenite = "0.24.0"
uuid = { version = "1.15.1", features = ["v4"] }
warp = "0.3.7"
y-octo = "0.0.1"
yrs-warp = "0.8.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-futures = "0.2"
jsonwebtoken = "9.3"
async-trait = "0.1.89"